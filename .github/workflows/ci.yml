name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build all targets
        run: make dist VERSION=${{ github.sha }}
      - name: Check the build is reproducible
        run: |
          mv dist dist-first
          make dist VERSION=${{ github.sha }}
          diff dist-first/SHA256SUMS dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: LocalLanView-binaries
          path: dist/
