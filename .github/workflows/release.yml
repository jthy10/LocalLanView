name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to release, e.g. v1.0.0
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # Re-running for a version that's already out only refreshes its notes.
      - name: Check for an existing release
        id: existing
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update release notes
        if: steps.existing.outputs.found == 'true'
        run: gh release edit "$VERSION" --notes-file .github/release-notes.md
      - uses: actions/setup-go@v5
        if: steps.existing.outputs.found != 'true'
        with:
          go-version-file: go.mod
      - if: steps.existing.outputs.found != 'true'
        run: go test ./...
      - if: steps.existing.outputs.found != 'true'
        run: make dist VERSION=$VERSION
      - name: Publish release
        if: steps.existing.outputs.found != 'true'
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "LocalLanView $VERSION" \
            --notes-file .github/release-notes.md
